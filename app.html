<style>
/* Layout: one narrow column, phone first. Deck tree on home; index card + fixed answer bar in study.
   Identity: Kairos as a weathered bronze. Verdigris accent, bronze for the moments of review (logo dots). Roman inscriptional caps for the wordmark. */
:root{
  --bg:#E9EDEC; --surface:#FFFFFF; --ink:#14201E; --muted:#566562; --line:#D0D9D7;
  --rule:#DCE6E3; --margin:#B07A3A; --accent:#1C6B62; --accent-ink:#FFFFFF; --bronze:#A06A28;
  --again:#B93A28; --hard:#A86A12; --good:#2A7A51; --easy:#2563A8;
  --new:#2563A8; --learn:#B93A28; --due:#2A7A51; --shadow:0 1px 2px rgba(20,32,30,.06),0 8px 24px rgba(20,32,30,.07);
  --f-brand:"Marcellus","Trajan Pro",Georgia,serif;
  --f-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-card:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#16201E; --ink:#E3ECEA; --muted:#93A5A1; --line:#283633;
  --rule:#1E2B28; --margin:#B98545; --accent:#62C3B4; --accent-ink:#0D1412; --bronze:#D6A45E;
  --again:#F0907E; --hard:#E3B562; --good:#6FC79A; --easy:#7DB3F0;
  --new:#7DB3F0; --learn:#F0907E; --due:#6FC79A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#16201E; --ink:#E3ECEA; --muted:#93A5A1; --line:#283633;
  --rule:#1E2B28; --margin:#B98545; --accent:#62C3B4; --accent-ink:#0D1412; --bronze:#D6A45E;
  --again:#F0907E; --hard:#E3B562; --good:#6FC79A; --easy:#7DB3F0;
  --new:#7DB3F0; --learn:#F0907E; --due:#6FC79A; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
#app{max-width:680px;margin:0 auto;padding-block:16px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
h1{font-family:var(--f-brand);font-weight:400;font-size:24px;letter-spacing:.16em;text-transform:uppercase;margin:0;line-height:1.1}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .mark{width:44px;height:44px;flex-shrink:0}
.tagline{font-family:var(--f-card);font-style:italic;font-size:14px;color:var(--muted)}
.mark .curve{fill:none;stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.mark .jump{stroke:var(--accent);stroke-width:2.6;stroke-linecap:round;opacity:.45}
.mark .dot{fill:var(--bronze)}
.mark .frame{fill:none;stroke:var(--line);stroke-width:1.5}
.done .mark{width:64px;height:64px;margin:0 auto 12px;display:block}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.today{font-size:13px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px}
.btn.danger{color:var(--again)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted)}
/* counts */
.counts{display:flex;gap:10px;font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums;flex-shrink:0}
.counts span{min-width:22px;text-align:right}
.c-new{color:var(--new)} .c-learn{color:var(--learn)} .c-due{color:var(--due)} .c-zero{color:var(--line)}
/* study-all strip */
.all{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);border:none;width:100%;text-align:left}
.all b{font-size:16px}
/* tree */
.tree{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.node{display:flex;align-items:center;gap:6px;border-top:1px solid var(--line);min-height:48px;padding-right:14px}
.tree>.node:first-child{border-top:none}
.tog{width:36px;height:48px;border:none;background:none;color:var(--muted);flex-shrink:0;display:grid;place-items:center}
.tog svg{transition:transform .15s}
.tog.open svg{transform:rotate(90deg)}
.tog.leaf{visibility:hidden}
.dname{flex:1;min-width:0;border:none;background:none;text-align:left;padding:12px 0;font-weight:500}
.dname small{display:block;font-weight:400;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);justify-content:flex-end}
details.settings{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 16px}
details.settings summary{padding:14px 0;font-weight:600;cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=search],select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical;font-family:var(--f-mono);font-size:13px;line-height:1.5}
/* study */
.studybar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
.studybar .title{min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.index{background:var(--surface);border-radius:6px;box-shadow:var(--shadow);overflow:hidden}
.index .head{display:flex;justify-content:space-between;gap:8px;padding:12px 18px 8px;font-size:12px;color:var(--muted);border-bottom:2px solid var(--margin)}
.index .head span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.face{font-family:var(--f-card);font-size:20px;line-height:1.55;padding:18px 18px 22px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 30px,var(--rule) 30px,var(--rule) 31px);background-position:0 18px;min-height:140px;overflow-wrap:anywhere}
.face.back{border-top:1px dashed var(--line);font-size:18px}
.face p{margin:0 0 .6em}
.face ul,.face ol{margin:.2em 0 .6em;padding-left:1.3em}
.face code{font-family:var(--f-mono);font-size:.8em;background:var(--bg);padding:1px 5px;border-radius:4px}
.face pre{font-family:var(--f-mono);font-size:13px;line-height:1.5;background:var(--bg);padding:12px;border-radius:6px;overflow-x:auto;margin:.4em 0}
.face h3{font-family:var(--f-ui);font-size:15px;margin:.4em 0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.face mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
.face mjx-container[display="true"]{margin:.5em 0!important}
.meta{display:flex;justify-content:space-between;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
.meta .btn{font-size:13px}
.meta .stale{color:var(--hard);font-weight:600}
.answerbar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:5}
.answerbar .inner{max-width:680px;margin:0 auto}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.grade b{font-size:14px}
.grade span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.g1 b{color:var(--again)} .g2 b{color:var(--hard)} .g3 b{color:var(--good)} .g4 b{color:var(--easy)}
.reveal{width:100%;padding:14px;font-size:16px}
.done{text-align:center;padding:40px 16px}
.done h1{margin-bottom:8px}
/* browse */
.filters{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
@media (min-width:560px){.filters{grid-template-columns:2fr 1fr}}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;border:none;border-top:1px solid var(--line);background:none;padding:12px 16px}
.list .item:first-child{border-top:none}
.item .q{font-family:var(--f-card);font-size:16px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.item .info{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.chip{font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;border:1px solid currentColor}
.chip.new{color:var(--new)} .chip.learn{color:var(--learn)} .chip.rev{color:var(--due)} .chip.sus{color:var(--muted)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,18,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding-top:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:720px){.scrim{align-items:center}.sheet{border-radius:16px}}
.sheet .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-t{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:99px;padding:6px 12px;font-size:13px}
.chip-t .mono{color:var(--muted);font-size:12px}
.chip-t.off{border-color:var(--line);color:var(--muted);text-decoration:line-through;background:transparent}
.pill{display:inline-block;font-size:11px;font-weight:600;color:var(--bronze);border:1px solid currentColor;border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:middle;text-decoration:none}
.hint{font-size:12px;color:var(--muted)}
.codebox{font-family:var(--f-mono);font-size:11px;min-height:80px;word-break:break-all}
.sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--bronze);flex-shrink:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90%}
/* notebook (caderno) */
.topbtns{display:flex;gap:8px}
.note{background:var(--surface);border-radius:6px;box-shadow:var(--shadow);padding:18px 18px 8px;border-top:2px solid var(--margin)}
.note .ntitle{font-family:var(--f-card);font-size:24px;line-height:1.25;margin:0 0 6px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.toc button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 10px;font-size:12px}
.nsec{border-top:1px solid var(--line);margin-top:14px;padding-top:12px;scroll-margin-top:12px;border-radius:4px;transition:background .6s}
.nsec.hit{background:color-mix(in srgb,var(--bronze) 14%,transparent)}
.nsec h3{font-size:15px;font-weight:600;margin:0 0 6px}
.nbody{font-family:var(--f-card);font-size:17px;line-height:1.55;overflow-wrap:anywhere}
.nbody p{margin:0 0 .6em}
.nbody ul,.nbody ol{margin:.2em 0 .6em;padding-left:1.3em}
.nbody li{margin:.15em 0}
.nbody code{font-family:var(--f-mono);font-size:.8em;background:var(--bg);padding:1px 5px;border-radius:4px}
.nbody pre{font-family:var(--f-mono);font-size:13px;line-height:1.5;background:var(--bg);padding:12px;border-radius:6px;overflow-x:auto}
.nbody h3{font-size:14px;margin:.4em 0}
.nbody mjx-container{max-width:100%;overflow-x:auto;overflow-y:hidden}
.nbody mjx-container[display="true"]{display:block;margin:.5em 0!important}
.nlinks{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:4px 0 6px}
.weak{color:var(--again);font-weight:600}
.checkq{border-top:1px dashed var(--line);padding:10px 0}
.checkq details summary{font-size:13px;color:var(--muted);cursor:pointer;margin-top:4px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:12px}
.tabs button{border:none;background:none;border-radius:7px;padding:8px 6px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.objs{margin:14px 0 4px;padding:12px 14px;background:var(--bg);border-radius:8px}
.objs h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 6px}
.objs ol{margin:0;padding-left:1.2em}
.objs li{margin:.35em 0}
.objs .nbody{font-size:16px}
.objs .oscore{display:block;font-size:12px;font-family:var(--f-ui)}
.summary h3{font-family:var(--f-ui);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:.9em 0 .3em}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px}
.opt .letter{font-family:var(--f-mono);font-weight:600;color:var(--muted);flex-shrink:0;width:18px}
.opt .nbody{font-size:16px;min-width:0}
.opt .nbody p{margin:0}
.opt.ok{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.opt.bad{border-color:var(--again);box-shadow:inset 3px 0 0 var(--again)}
.opt.dim{opacity:.7}
.opt .why{display:block;margin-top:6px;font-family:var(--f-ui);font-size:13px;color:var(--muted)}
.opt .why p{margin:0}
.verdict{margin-top:12px;font-weight:600}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--again)}
.reread{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--again);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.reread span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<script>
/* ---------- utils ---------- */
const MIN=6e4, DAY=864e5;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function nextRollover(now){const d=new Date(now);d.setHours(4,0,0,0);if(d.getTime()<=now)d.setDate(d.getDate()+1);return d.getTime()}
function dayKey(now){const d=new Date(now-4*3600e3);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtIvl(ms){
  const m=ms/MIN; if(m<60)return Math.max(1,Math.round(m))+' min';
  const h=m/60; if(h<24)return Math.round(h)+' h';
  const d=ms/DAY; if(d<30)return Math.round(d)+' d';
  if(d<365)return (d/30).toFixed(1).replace('.',',')+' m';
  return (d/365).toFixed(1).replace('.',',')+' a';
}
let toastT; function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

/* ---------- markdown + math ---------- */
function md(src){
  const keep=[]; const ph=s=>{keep.push(s);return '\u0000'+(keep.length-1)+'\u0000'};
  let t=String(src||'').replace(/\r/g,'');
  t=t.replace(/```[^\n]*\n([\s\S]*?)```/g,(_,c)=>ph('<pre><code>'+esc(c.replace(/\n$/,''))+'</code></pre>'));
  t=t.replace(/(\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^$\n]+?\$)/g,m=>ph(esc(m)));
  t=t.replace(/`([^`\n]+)`/g,(_,c)=>ph('<code>'+esc(c)+'</code>'));
  t=esc(t).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  const out=[]; let list=null, para=[];
  const flushP=()=>{if(para.length){out.push('<p>'+para.join('<br>')+'</p>');para=[]}};
  const flushL=()=>{if(list){out.push('<'+list.tag+'>'+list.items.map(i=>'<li>'+i+'</li>').join('')+'</'+list.tag+'>');list=null}};
  for(const line of t.split('\n')){
    let m;
    if((m=line.match(/^\s*[-•]\s+(.*)$/))){flushP();if(!list||list.tag!=='ul'){flushL();list={tag:'ul',items:[]}}list.items.push(m[1]);continue}
    if((m=line.match(/^\s*\d+[.)]\s+(.*)$/))){flushP();if(!list||list.tag!=='ol'){flushL();list={tag:'ol',items:[]}}list.items.push(m[1]);continue}
    flushL();
    if((m=line.match(/^#{1,4}\s+(.*)$/))){flushP();out.push('<h3>'+m[1]+'</h3>');continue}
    if(!line.trim()){flushP();continue}
    para.push(line);
  }
  flushP();flushL();
  return out.join('').replace(/\u0000(\d+)\u0000/g,(_,i)=>keep[+i]);
}
function plain(src){return String(src||'').replace(/```[\s\S]*?```/g,'[código]').replace(/[*#`]/g,'').replace(/\s+/g,' ').trim()}
function typeset(el){
  const go=()=>{try{MathJax.typesetClear&&MathJax.typesetClear([el]);MathJax.typesetPromise([el]).catch(()=>{})}catch(e){}};
  if(window.MathJax&&MathJax.typesetPromise){MathJax.startup.promise.then(go)}
  else{let n=0;const w=setInterval(()=>{if(window.MathJax&&MathJax.typesetPromise){clearInterval(w);MathJax.startup.promise.then(go)}else if(++n>40)clearInterval(w)},250)}
}

/* ---------- FSRS-4.5 scheduler ---------- */
const W=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const DECAY=-0.5, FACTOR=19/81, STEPS=[1,10], RELEARN=[10];
const clampD=d=>Math.min(10,Math.max(1,d));
const retr=(t,s)=>Math.pow(1+FACTOR*t/s,DECAY);
const ivl=(s,r)=>Math.max(1,Math.min(36500,Math.round(s/FACTOR*(Math.pow(r,1/DECAY)-1))));
const initS=g=>Math.max(0.1,W[g-1]);
const initD=g=>clampD(W[4]-(g-3)*W[5]);
const nextD=(d,g)=>clampD(W[7]*initD(4)+(1-W[7])*(d-W[6]*(g-3)));
const recallS=(d,s,r,g)=>s*(1+Math.exp(W[8])*(11-d)*Math.pow(s,-W[9])*(Math.exp((1-r)*W[10])-1)*(g===2?W[15]:1)*(g===4?W[16]:1));
const forgetS=(d,s,r)=>Math.min(s,W[11]*Math.pow(d,-W[12])*(Math.pow(s+1,W[13])-1)*Math.exp((1-r)*W[14]));

function schedule(prev,g,now){
  const r=+S.settings.retention||0.9, shortSteps=S.settings.steps==='short';
  const base=prev||{state:'new',reps:0,lapses:0};
  let {state,s,d}=base; const step=base.step||0;
  const out={reps:(base.reps||0)+1,lapses:base.lapses||0,last:now};
  const learn=(st,arr,i,ss,dd,due)=>({...out,state:st,s:ss,d:dd,step:i,due:due??now+arr[i]*MIN});
  const grad=(ss,dd,days)=>({...out,state:'review',s:ss,d:dd,step:0,ivl:days,due:now+days*DAY});
  if(state==='new'){
    s=initS(g); d=initD(g);
    if(g===1)return learn('learning',STEPS,0,s,d);
    if(shortSteps){
      if(g===2)return learn('learning',STEPS,0,s,d,now+Math.round((STEPS[0]+STEPS[1])/2)*MIN);
      if(g===3)return learn('learning',STEPS,1,s,d);
    }else if(g===2)return learn('learning',STEPS,1,s,d);
    return grad(s,d,ivl(s,r));
  }
  if(state==='learning'||state==='relearning'){
    const arr=state==='learning'?STEPS:RELEARN;
    if(g===1)return learn(state,arr,0,s,d);
    if(g===2)return learn(state,arr,step,s,d);
    if(g===3&&shortSteps&&step+1<arr.length)return learn(state,arr,step+1,s,d);
    if(g===4){
      if(state==='learning'){const s4=Math.max(s,W[3]);return grad(s4,d,ivl(s4,r))}
      return grad(s,d,ivl(s,r)+1);
    }
    return grad(s,d,ivl(s,r));
  }
  const t=Math.max(0,(now-(base.last||now))/DAY), R=retr(t,s);
  if(g===1)return {...learn('relearning',RELEARN,0,forgetS(d,s,R),nextD(d,1)),lapses:out.lapses+1};
  const c=[2,3,4].map(x=>({s:recallS(d,s,R,x),d:nextD(d,x)}));
  let h=ivl(c[0].s,r), gd=ivl(c[1].s,r), e=ivl(c[2].s,r);
  h=Math.min(h,gd); gd=Math.max(gd,h+1); e=Math.max(e,gd+1);
  return grad(c[g-2].s,c[g-2].d,[h,gd,e][g-2]);
}

/* ---------- outbox: every write goes to localStorage first, then syncs ----------
   One pending op per document path (set/delete replace the whole doc, so the
   latest op is the only one that matters). Snapshots are overlaid with pending
   ops, so unsynced answers never revert on screen. */
const OUTBOX_KEY='kairos.outbox', WRITE_TIMEOUT=10000, RETRY_MS=15000;
let outbox=ls.get(OUTBOX_KEY,[]); if(!Array.isArray(outbox))outbox=[];
let flushing=false, retryT=null;
function saveOutbox(){ls.set(OUTBOX_KEY,outbox)}
function queue(path,kind,body){
  outbox=outbox.filter(o=>o.p!==path);
  outbox.push({p:path,k:kind,b:kind==='set'?body:null,t:Date.now()});
  saveOutbox(); flush();
}
function pendingFor(path){return outbox.find(o=>o.p===path)}
function overlay(coll,m){
  for(const o of outbox){const i=o.p.indexOf('/');if(o.p.slice(0,i)!==coll)continue;const id=o.p.slice(i+1);if(o.k==='del')m.delete(id);else if(!(o.b&&o.b.__restored))m.set(id,o.b)}
  return m;
}
const withTimeout=(pr,ms)=>Promise.race([pr,new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}),ms))]);
async function flush(){
  if(flushing||!S.db)return;
  flushing=true; clearTimeout(retryT); retryT=null;
  try{
    while(outbox.length){
      const o=outbox[0], ref=S.db.doc(o.p);
      try{await withTimeout(o.k==='del'?ref.delete():ref.set(o.b),WRITE_TIMEOUT)}
      catch(e){
        const code=e&&e.code;
        if(code==='invalid_argument'||code==='quota_exceeded'||code==='transform_error'){
          toast(code==='quota_exceeded'?'Limite de armazenamento atingido. Apague cards antigos.':'Uma alteração foi recusada e descartada.');
          const i=outbox.indexOf(o); if(i>=0){outbox.splice(i,1);saveOutbox()} continue;
        }
        S.offline=true; break;
      }
      const i=outbox.indexOf(o); if(i>=0){outbox.splice(i,1);saveOutbox()}
      S.offline=false;
    }
  }finally{
    flushing=false;
    if(outbox.length&&!retryT)retryT=setTimeout(flush,RETRY_MS);
    render();
  }
}

function cardSig(c){let h=2166136261;const t=(c.front||'')+'\u0001'+(c.back||'');for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}

function deckCounts(){
  const now=Date.now(), roll=nextRollover(now), m=new Map();
  for(const [id,c] of S.cards){
    if(c.suspended||!passesFilter(c)||isFlagged(id,c))continue;
    const k=c.deck; if(!m.has(k))m.set(k,{n:0,l:0,r:0,total:0});
    const o=m.get(k); o.total++;
    const rv=S.revs.get(id);
    if(!rv)o.n++;
    else if(rv.state==='review'){if(rv.due<roll)o.r++}
    else if(rv.due<roll)o.l++;

}

/* ---------- study queue ---------- */
function nextCard(deckSet,idSet){
  const now=Date.now(), roll=nextRollover(now);
  let learn=[],rev=[],fresh=[];
  for(const [id,c] of cardsOrdered()){
    if(c.suspended||!passesFilter(c)||!deckSet.has(c.deck)||isFlagged(id,c))continue;
    if(idSet&&!idSet.has(id))continue;
    const rv=S.revs.get(id);
    if(!rv)fresh.push(id);
    else if(rv.state==='review'){if(rv.due<roll)rev.push([id,rv.due])}
    else learn.push([id,rv.due]);
  }
  learn.sort((a,b)=>a[1]-b[1]); rev.sort((a,b)=>a[1]-b[1]);
  const dueLearn=learn.filter(x=>x[1]<=now);
  const left=newLeft();
  const counts={n:Math.min(fresh.length,left),l:learn.filter(x=>x[1]<roll).length,r:rev.length};
  let pick=null;
  if(dueLearn.length)pick=dueLearn[0][0];
  else if(rev.length&&(!left||!fresh.length||S.study.flip%3!==2))pick=rev[0][0];
  else if(left&&fresh.length)pick=fresh[0];
  else if(rev.length)pick=rev[0][0];
  else if(learn.length&&learn[0][1]<=now+20*MIN)pick=learn[0][0];
  const wait=(!pick&&learn.length&&learn[0][1]<roll)?learn[0][1]:null;
  return {pick,counts,wait};
}

function advance(){

}

  const st=S.study; const id=st.cur; if(!id||!st.revealed)return;
  const now=Date.now(), prev=S.revs.get(id)||null, next=schedule(prev,g,now);
  const key=dayKey(now); if(key!==S.logKey)subLog(key);
  const entry={c:id,g,t:now,p:prev?prev.state:'new'};
  S.revs.set(id,next); S.log=[...S.log,entry];

  const card=S.cards.get(id); st.missed=g===1&&card&&noteOf(card)?id:null;

}

  if(u.prev)S.revs.set(u.id,u.prev); else S.revs.delete(u.id);
  S.log=S.log.filter(e=>e.t!==u.t); const logCopy=S.log.slice();

}

function buildTree(){

/* ---------- notebook (caderno): study notes; a card links back with note: "noteId#sectionId" ---------- */
function parseRef(ref){const r=String(ref||''),i=r.indexOf('#');return i<0?{id:r,sec:''}:{id:r.slice(0,i),sec:r.slice(i+1)}}
function noteOf(c){if(!c||!c.note)return null;const r=parseRef(c.note),n=S.notes.get(r.id);return n?{...r,n}:null}
function noteCards(nid,sec){return cardsOrdered().filter(([id,c])=>{if(c.suspended||!c.note)return false;const r=parseRef(c.note);return r.id===nid&&(!sec||r.sec===sec)})}
/* weak = the card was missed at least once (lapse) or is back in learning after an answer */
function isWeak(id){const rv=S.revs.get(id);return !!(rv&&(rv.lapses>0||(rv.state!=='review'&&rv.reps>0)))}
function linksHTML(rows){
  if(!rows.length)return '<span>Sem cartas ligadas</span>';
  const weak=rows.filter(([id])=>isWeak(id)).length;
  return '<span>'+rows.length+(rows.length===1?' carta':' cartas')+(weak?' · <span class="weak">'+weak+(weak===1?' fraca':' fracas')+'</span>':'')+'</span>';
}
function notesOrdered(){return [...S.notes.entries()].sort((a,b)=>deckName(a[1].deck).localeCompare(deckName(b[1].deck),'pt')||((a[1].order||0)-(b[1].order||0))||String(a[1].title).localeCompare(String(b[1].title),'pt'))}
/* ---------- questions: multiple choice (graded by the app) and open (self-graded) ----------
   qrev/{questionId} = FSRS state + lastOk (1, 0.5 or 0) + tries/okTries.
   In a session: a miss comes back after 3 other questions; a hit or "Moderado" leaves the session.
   Between sessions: FSRS decides the day. The user never sees grade buttons for multiple choice. */
const OBJ_VERBS={definir:'Definir',explicar:'Explicar',calcular:'Calcular',comparar:'Comparar',diagnosticar:'Diagnosticar'};
function noteQuestions(nid){const n=S.notes.get(nid);return n&&Array.isArray(n.questions)?n.questions.map(q=>({...q,nid})):[]}
function allQuestions(){const out=[];for(const [nid] of notesOrdered())out.push(...noteQuestions(nid));return out}
function questionById(id){for(const q of allQuestions())if(q.id===id)return q;return null}
function qPending(q){const r=S.qrev.get(q.id);return !r||r.due<nextRollover(Date.now())}
function pendingCount(qs){return qs.filter(qPending).length}
function objScore(nid,oid){
  const qs=noteQuestions(nid).filter(q=>q.obj===oid); let seen=0,ok=0;
  for(const q of qs){const r=S.qrev.get(q.id);if(r){seen++;ok+=+r.lastOk||0}}
  return {total:qs.length,seen,ok};
}
function scoreHTML(sc){
  if(!sc.total)return '';
  if(!sc.seen)return '<span class="muted">'+sc.total+(sc.total===1?' questão':' questões')+'</span>';
  const pct=Math.round(100*sc.ok/sc.seen);
  return '<span class="'+(pct<70?'weak':'c-due')+'">'+pct+'%</span> <span class="muted">· '+sc.seen+'/'+sc.total+' feitas</span>';
}
function objectivesHTML(nid,n){
  const objs=Array.isArray(n.objectives)?n.objectives:[]; if(!objs.length)return '';
  return '<div class="objs"><h3>Ao final, você consegue</h3><ol>'+objs.map(o=>'<li><span class="nbody"><b>'+esc(OBJ_VERBS[o.verb]||o.verb)+'</b> '+md(o.text).replace(/^<p>|<\/p>$/g,'')+'</span><span class="oscore">'+scoreHTML(objScore(nid,o.id))+'</span></li>').join('')+'</ol></div>';
}
/* FSRS for questions. "Moderado" on a new question goes straight to days (≈1 d), not to a 10-min step. */
function qschedule(prev,g,now){
  const st=prev?prev.state:'new';
  if(g===2&&st!=='review'){
    const s=Math.max(prev&&prev.s||0,initS(2)), d=prev&&prev.d||initD(2), days=ivl(s,+S.settings.retention||0.9);
    return {reps:(prev&&prev.reps||0)+1,lapses:prev&&prev.lapses||0,last:now,state:'review',s,d,step:0,ivl:days,due:now+days*DAY};
  }
  const saved=S.settings.steps; S.settings.steps='errors';
  try{return schedule(prev,g,now)}finally{S.settings.steps=saved}
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(nid,everything){
  const qs=nid?noteQuestions(nid):allQuestions(), pick=everything?qs:qs.filter(qPending);
  if(!pick.length){toast('Nenhuma questão pendente');return}
  const n=nid&&S.notes.get(nid);
  S.quiz={nid,label:n?(n.title||nid):'Questões pendentes',back:S.view,noteBack:S.note?S.note.back:'notebook',
    queue:shuffle(pick.map(q=>q.id)),total:pick.length,missed:new Set(),done:new Set(),cur:null,order:[],picked:null,shown:false,typed:''};
  nextQuestion(); S.view='quiz'; render(); scrollTo(0,0);
}
function nextQuestion(){
  const z=S.quiz; z.cur=z.queue.shift()||null; z.picked=null; z.shown=false; z.typed=''; z.repeat=!!(z.cur&&z.missed.has(z.cur));
  const q=z.cur&&questionById(z.cur); z.order=q&&q.type==='mc'?shuffle(q.options.map((_,i)=>i)):[];
}
function gradeQuestion(g){
  const z=S.quiz, q=questionById(z.cur); if(!q)return;
  const now=Date.now(), prev=S.qrev.get(q.id)||null;
  const next={...qschedule(prev,g,now),lastOk:g===3?1:g===2?0.5:0,tries:(prev&&prev.tries||0)+1,okTries:(prev&&prev.okTries||0)+(g===3?1:0)};
  S.qrev.set(q.id,next); queue('qrev/'+q.id,'set',next);
  if(g===1){z.missed.add(q.id);z.queue.splice(Math.min(3,z.queue.length),0,q.id)}
  else z.done.add(q.id);
}
function pickOption(i){
  const z=S.quiz, q=questionById(z.cur); if(!q||q.type!=='mc'||z.picked!=null)return;
  z.picked=i; gradeQuestion(q.options[i]&&q.options[i].ok?3:1); render();
}

    (tabs.length>1?'<div class="tabs" role="tablist">'+tabs.map(t=>'<button role="tab" aria-selected="'+(t[0]===tab)+'" data-note-tab="'+t[0]+'">'+esc(t[1])+'</button>').join('')+'</div>':'')+
    '<article class="note"><h2 class="ntitle">'+esc(n.title||nid)+'</h2>';
  const quizBtns=qs.length?'<div class="row" style="margin-top:14px">'+(pend?'<button class="btn primary" data-quiz-note="'+esc(nid)+'">Fazer as '+pend+(pend===1?' questão':' questões')+'</button>':'<button class="btn primary" data-quiz-note="'+esc(nid)+'" data-quiz-every>Refazer todas as '+qs.length+'</button>')+'</div>':'';
  if(tab==='resumo'){
    h+='<div class="nbody summary">'+md(n.summary||'')+'</div></article>'+quizBtns;
    return h;
  }
  if(tab==='questoes'){
    h+=objectivesHTML(nid,n)+'<p class="hint">'+qs.filter(q=>q.type==='mc').length+' de múltipla escolha, corrigidas pelo app. '+qs.filter(q=>q.type!=='mc').length+' dissertativas: você compara com a resposta modelo e se avalia.</p></article>'+quizBtns;
    if(pend&&pend<qs.length)h+='<div class="row" style="margin-top:8px"><button class="btn ghost" data-quiz-note="'+esc(nid)+'" data-quiz-every>Refazer todas as '+qs.length+'</button></div>';
    return h;
  }
  h+='<div class="hint">'+(n.source?esc(n.source):'')+(n.verified?' · verificado em '+esc(n.verified):'')+'</div>'+
    (n.intro?'<div class="nbody" style="margin-top:10px">'+md(n.intro)+'</div>':'')+objectivesHTML(nid,n)+
    (secs.length>1?'<nav class="toc" aria-label="Seções">'+secs.map(s=>'<button data-jump="'+esc(s.id)+'">'+esc(s.title)+'</button>').join('')+'</nav>':'');
  for(const s of secs){
    const rows=noteCards(nid,s.id);
    h+='<section class="nsec" id="sec-'+esc(s.id)+'"><h3>'+esc(s.title)+'</h3><div class="nbody">'+md(s.body)+'</div>'+
      '<div class="nlinks">'+linksHTML(rows)+(rows.length?'<button class="btn ghost" data-study-note="'+esc(nid+'#'+s.id)+'">Estudar estas</button>':'')+'</div></section>';
  }
  h+='</article>'+quizBtns;
  if(all.length)h+='<div class="row" style="margin-top:8px"><button class="btn" data-study-note="'+esc(nid)+'">Estudar as '+all.length+' cartas desta nota</button></div>';
  return h;
}
function openNote(ref,back){
  const r=parseRef(ref); if(!S.notes.has(r.id)){toast('Nota não encontrada');return}
  const from=S.view==='note'&&S.note?S.note.back:S.view;
  S.note={id:r.id,back:back||from,tab:r.sec?'nota':(S.note&&S.note.id===r.id&&S.view==='note'?S.note.tab:'nota')}; S.view='note'; render();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{if(r.sec)jumpTo(r.sec);else scrollTo(0,0)}));
}
function jumpTo(sec){
  const el=document.getElementById('sec-'+sec); if(!el)return;
  el.scrollIntoView({block:'start'}); el.classList.add('hit'); setTimeout(()=>el.classList.remove('hit'),1600);
}
function studyNote(ref){
  const r=parseRef(ref), n=S.notes.get(r.id); if(!n)return;
  const ids=noteCards(r.id,r.sec).map(x=>x[0]); if(!ids.length){toast('Nenhuma carta ligada');return}
  const sec=r.sec&&(n.sections||[]).find(s=>s.id===r.sec);
  startStudy(null,(n.title||r.id)+(sec?' › '+sec.title:''),ids);
}
function copyText(text,done){
  const manual=()=>{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast(done)}catch(e){toast('Não foi possível copiar')}t.remove()};
  try{navigator.clipboard.writeText(text).then(()=>toast(done),manual)}catch(e){manual()}
}

let raf=0; function render(){if(!raf)raf=requestAnimationFrame(doRender)}
function doRender(){
  raf=0;
  const app=document.getElementById('app'), ov=document.getElementById('overlay');
  if(S.nodb){app.innerHTML='<div class="notice">Abra esta página no claude.ai para acessar seus cards.</div>';return}
  if(S.err){app.innerHTML='<div class="notice">A conexão com os dados caiu ('+esc(S.err)+'). Recarregue a página.</div>';return}
  if(S.view==='study'&&S.study&&(!S.study.cur||!S.cards.get(S.study.cur))){S.study.cur=null;advance()}
  const focus=document.activeElement&&document.activeElement.id, sel=focus==='b-q'?document.activeElement.selectionStart:null;
  const keep={};for(const id of ['acct-email','acct-code','set-new','f-note']){const el=document.getElementById(id);if(el&&document.activeElement===el)keep[id]=el.value}
  if(!S.edit&&!S.flagging&&(S.view==='note'||(S.view==='quiz'&&S.quiz))){
    /* Notes and questions are typeset by MathJax: rebuild only when the HTML changes, so sync ticks do not reset the page. */
    const html=syncHTML()+(S.view==='note'?noteHTML():quizHTML());
    if(app.dataset.cache!==html){app.innerHTML=html;app.dataset.cache=html;typeset(app)}
  }else if(!S.edit&&!S.flagging){
    delete app.dataset.cache;
    app.innerHTML=(S.view==='study'&&S.study?studyHTML():S.view==='browse'?browseHTML():S.view==='notebook'?notebookHTML():homeHTML())+answerBarHTML();
    if(S.view==='study'&&S.study&&S.study.cur){
      const c=S.cards.get(S.study.cur), f=document.getElementById('face-front'), b=document.getElementById('face-back');
      if(f){f.innerHTML=md(c.front);typeset(f)} if(b){b.innerHTML=md(c.back);typeset(b)}
    }
    for(const id in keep){const el=document.getElementById(id);if(el){el.value=keep[id];el.focus()}}
    if(focus==='b-q'){const i=document.getElementById('b-q');if(i){i.focus();if(sel!=null)i.setSelectionRange(sel,sel)}}
  }
  ov.innerHTML=editorHTML()||flagSheetHTML();
}

/* ---------- account and sync (website only) ---------- */
function acct(){return window.KAIROS_WEB&&window.KAIROS_WEB.account}
function syncLine(){
  const A=acct(); if(!A||!A.configured())return '';
  const u=A.user(), st=A.state();
  if(!u)return ' · <span class="muted">só neste aparelho</span>';
  if(st.error)return ' · <span style="color:var(--again)">sincronização falhou</span>';
  if(st.syncing||st.pending)return ' · sincronizando…';
  return ' · sincronizado';
}
function accountHTML(){
  const A=acct(); if(!A||!A.configured())return '';
  const u=A.user(), st=A.state(), f=S.login;
  let b;
  if(u){
    const when=st.lastSync?new Date(st.lastSync).toLocaleString('pt-BR',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'}):'ainda não';
    b='<p style="margin:0 0 8px">Conectado como <b>'+esc(u.email)+'</b>.</p>'+
      '<p class="hint" style="margin:0 0 12px">Última sincronização: '+esc(when)+(st.pending?' · '+st.pending+' alteração(ões) a enviar':'')+(st.error?' · erro: '+esc(st.error):'')+'</p>'+
      '<div class="row" style="margin-bottom:16px"><button class="btn" data-acct="sync">Sincronizar agora</button><button class="btn ghost" data-acct="signout">Sair</button></div>';
  }else{
    b='<p class="hint" style="margin:0 0 12px">Entre para sincronizar o progresso entre aparelhos e ver seus baralhos privados. Sem login, tudo continua funcionando neste aparelho.</p>'+
      '<div class="field"><label for="acct-email">E-mail</label><input id="acct-email" type="email" autocomplete="email" inputmode="email" value="'+esc(f.email)+'"></div>';
    if(f.sent)b+='<div class="field"><label for="acct-code">Código de 6 dígitos enviado para o e-mail</label><input id="acct-code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10"></div>'+
      '<div class="row" style="margin-bottom:16px"><button class="btn primary" data-acct="verify"'+(f.busy?' disabled':'')+'>Entrar</button><button class="btn ghost" data-acct="send"'+(f.busy?' disabled':'')+'>Reenviar código</button></div>';
    else b+='<div class="row" style="margin-bottom:16px"><button class="btn primary" data-acct="send"'+(f.busy?' disabled':'')+'>Enviar código</button></div>';
  }
  return '<details class="settings" data-panel="conta"'+(S.panels.has('conta')?' open':'')+'><summary>Conta e sincronização'+(u?'':' <span class="pill">opcional</span>')+'</summary>'+b+'</details>';
}
async function acctAction(a){
  const A=acct(); if(!A)return; const f=S.login;
  try{
    if(a==='send'){const email=(document.getElementById('acct-email').value||'').trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){toast('Digite um e-mail válido');return}f.email=email;f.busy=true;render();await A.sendCode(email);f.sent=true;toast('Código enviado. Confira o e-mail.')}
    else if(a==='verify'){const code=(document.getElementById('acct-code').value||'').replace(/\D/g,'');if(code.length<6){toast('Digite o código de 6 dígitos');return}f.busy=true;render();await A.verify(f.email,code);S.login={email:'',sent:false,busy:false};toast('Conectado')}
    else if(a==='sync'){await A.syncNow();toast(A.state().error?'Falhou: '+A.state().error:'Sincronizado')}
    else if(a==='signout'){await A.signOut();toast('Você saiu. Os dados deste aparelho foram limpos.')}
  }catch(e){toast((e&&e.message)||'Falhou')}
  finally{f.busy=false;render()}
}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button,[data-close-scrim]'); if(!t)return;
  const d=t.dataset;
  if(d.closeScrim!==undefined&&ev.target!==t)return;
  if(d.closeScrim!==undefined||d.close!==undefined){S.edit=null;S.flagging=null;S.confirmDel=false;render();return}
  if(d.flag){S.edit=null;S.flagging=d.flag;render();setTimeout(()=>{const n=document.getElementById('f-note');if(n)n.focus()},50);return}
  if(d.flagSave!==undefined){
    const id=S.flagging,c=S.cards.get(id); if(!c){S.flagging=null;render();return}
    const body={note:(document.getElementById('f-note').value||'').trim().slice(0,500),at:Date.now(),sig:cardSig(c)};
    S.flags.set(id,body); queue('flags/'+id,'set',body); S.flagging=null;
    if(S.study&&S.study.cur===id){S.study.cur=null;advance()}
    toast('Card sinalizado. Ele sai do estudo até ser corrigido.'); render(); return}
  if(d.unflag){S.flags.delete(d.unflag);queue('flags/'+d.unflag,'del');S.edit=null;toast('Sinal removido');render();return}
  if(d.copyFlags!==undefined){copyField('flag-report');return}
  if(d.restore){queue('cards/'+d.restore,'set',{__restored:true});toast('Card restaurado');render();return}
  if(d.tag){const off=S.filter.off;const i=off.indexOf(d.tag);if(i>=0)off.splice(i,1);else off.push(d.tag);saveFilter();if(S.study)S.study.cur=null;render();return}
  if(d.tagReset!==undefined){S.filter.off=[];saveFilter();render();return}
  if(d.acct){acctAction(d.acct);return}
  if(d.openNote){openNote(d.openNote);return}
  if(d.noteBack!==undefined){const b=S.note&&S.note.back;S.note=null;S.view=b==='study'?(S.study?'study':'home'):b==='quiz'?(S.quiz?'quiz':'notebook'):(b==='notebook'||b==='browse')?b:'home';render();scrollTo(0,0);return}
  if(d.noteTab){if(S.note){S.note.tab=d.noteTab;render();scrollTo(0,0)}return}
  if(d.quizNote){startQuiz(d.quizNote,d.quizEvery!==undefined);return}
  if(d.quizAll!==undefined){startQuiz(null,false);return}
  if(d.opt!==undefined){pickOption(+d.opt);return}
  if(d.qNext!==undefined){nextQuestion();render();scrollTo(0,0);return}
  if(d.qShow!==undefined){const t=document.getElementById('q-ans');if(t)S.quiz.typed=t.value;S.quiz.shown=true;render();return}
  if(d.qGrade){gradeQuestion(+d.qGrade);nextQuestion();render();scrollTo(0,0);return}
  if(d.qCopy!==undefined){const q=questionById(S.quiz.cur);if(q)copyText('Kairos — corrija minha resposta.\nPergunta: '+plain(q.stem)+'\nMinha resposta: '+(S.quiz.typed.trim()||'(vou ditar)'),'Copiado. Cole no chat com o Claude.');return}
  if(d.quizBack!==undefined){const z=S.quiz;S.quiz=null;if(z&&z.back==='note'&&z.nid&&S.notes.has(z.nid)){S.note={id:z.nid,back:z.noteBack||'notebook',tab:'questoes'};S.view='note'}else S.view='notebook';render();scrollTo(0,0);return}
  if(d.jump){jumpTo(d.jump);return}
  if(d.studyNote){studyNote(d.studyNote);return}
  if(d.missedClose!==undefined){if(S.study)S.study.missed=null;render();return}

  if(d.tog){S.open.has(d.tog)?S.open.delete(d.tog):S.open.add(d.tog);ls.set('fich.open',[...S.open]);render();return}
  if(d.study){startStudy(d.study,d.study.split('::').join(' › '));return}
  if(d.studyAll!==undefined){startStudy(null,'Todos os baralhos');return}
  if(d.go){S.view=d.go;if(d.go!=='study')clearTimeout(waitTimer);render();scrollTo(0,0);return}
  if(d.reveal!==undefined){S.study.revealed=true;render();return}
  if(d.grade){answer(+d.grade);return}
  if(d.undo!==undefined){undo();return}
  if(d.edit){S.edit={id:d.edit};S.confirmDel=false;render();return}
  if(d.newCard!==undefined){const ids=S.browse.deck?deckIdsUnder(S.browse.deck):[];S.edit={id:null,deck:ids[0]};render();return}
  if(d.saveSettings!==undefined){
    const n=Math.max(0,Math.min(999,parseInt(document.getElementById('set-new').value,10)||0)), r=parseFloat(document.getElementById('set-ret').value)||0.9, stp=document.getElementById('set-steps').value==='short'?'short':'errors';
    S.settings={...S.settings,newPerDay:n,retention:r,steps:stp}; const copy={...S.settings};
    queue('config/settings','set',copy); toast('Ajustes salvos'); render(); return}
  if(d.save!==undefined){
    const e=S.edit, old=e.id?S.cards.get(e.id):null, now=Date.now();
    const front=document.getElementById('e-front').value.trim(), back=document.getElementById('e-back').value.trim();
    if(!front){toast('A frente não pode ficar vazia');return}
    const body={...(old||{created:now}),deck:document.getElementById('e-deck').value,front,back,
      tags:document.getElementById('e-tags').value.split(',').map(s=>s.trim()).filter(Boolean),
      source:document.getElementById('e-src').value.trim(),suspended:document.getElementById('e-sus').checked,updated:now};
    const id=e.id||('u-'+now.toString(36)+Math.random().toString(36).slice(2,6));
    S.cards.set(id,body); S.edit=null; queue('cards/'+id,'set',body); toast('Card salvo'); render(); return}
  if(d.del!==undefined){
    if(!S.confirmDel){S.confirmDel=true;render();return}
    const id=S.edit.id; S.cards.delete(id); S.revs.delete(id); S.edit=null; S.confirmDel=false;
    queue('cards/'+id,'del'); queue('reviews/'+id,'del'); toast('Card excluído'); render(); return}
  if(d.reset!==undefined){const id=S.edit.id; S.revs.delete(id); queue('reviews/'+id,'del'); toast('Progresso zerado'); render(); return}
});
document.addEventListener('toggle',ev=>{const p=ev.target&&ev.target.dataset&&ev.target.dataset.panel;if(!p)return;if(ev.target.open)S.panels.add(p);else S.panels.delete(p);ls.set('kairos.panels',[...S.panels])},true);
document.addEventListener('input',ev=>{
  if(ev.target.id==='b-q'){S.browse.q=ev.target.value;render()}
  if(ev.target.id==='q-ans'&&S.quiz)S.quiz.typed=ev.target.value;
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='b-deck'){S.browse.deck=ev.target.value;render()}
});
document.addEventListener('keydown',ev=>{
  if(S.edit||S.flagging){if(ev.key==='Escape'){S.edit=null;S.flagging=null;render()}return}
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement&&document.activeElement.tagName))return;
  if(S.view==='quiz'&&S.quiz&&S.quiz.cur){
    const z=S.quiz;
    if(z.picked==null&&/^[1-5]$/.test(ev.key)&&z.order[+ev.key-1]!=null){pickOption(z.order[+ev.key-1]);return}
    if(z.picked!=null&&(ev.key==='Enter'||ev.key===' ')){ev.preventDefault();nextQuestion();render();return}
    return;
  }
  if(S.view!=='study'||!S.study||!S.study.cur)return;
  if(!S.study.revealed&&(ev.key===' '||ev.key==='Enter')){ev.preventDefault();S.study.revealed=true;render();return}
  if(S.study.revealed&&/^[1-4]$/.test(ev.key)){answer(+ev.key);return}
  if(S.study.revealed&&ev.key===' '){ev.preventDefault();answer(3);return}
  if(ev.key==='u'||ev.key==='z')undo();
});

/* ---------- data ---------- */
function subLog(key){
  if(S.logUnsub)S.logUnsub(); S.logKey=key;
  const pend=pendingFor('log/'+key); S.log=pend&&pend.b?pend.b.entries.slice():[];
  S.logUnsub=S.db.doc('log/'+key).onSnapshot(d=>{
    const pend=pendingFor('log/'+key);
    if(pend)S.log=pend.k==='set'?pend.b.entries.slice():[];
    else{const e=d.exists?d.data().entries:null;S.log=Array.isArray(e)?e.slice():[]}
    render();
  },e=>{if(e&&e.code==='unavailable')resubscribeSoon()});
}
async function boot(){
  render();
  const timer=setTimeout(()=>{S.stale=true;render()},10000);
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){clearTimeout(timer);S.nodb=true;render();return}
  S.db=db; S.bootTimer=timer;
  subscribeAll(); flush();
  setInterval(()=>{const k=dayKey(Date.now());if(k!==S.logKey){subLog(k);render()}},60000);
}
let unsubs=[], resubT=null;
function resubscribeSoon(){
  /* The host stopped answering (e.g. connection lost). Keep showing what we have, and open fresh listeners later. */
  S.offline=true; render();
  if(resubT)return;
  resubT=setTimeout(()=>{resubT=null;subscribeAll();flush()},RETRY_MS);
}
function subscribeAll(){
  const db=S.db;
  for(const u of unsubs)try{u()}catch(e){} unsubs=[];
  const fail=e=>{
    clearTimeout(S.bootTimer);
    if(!e||e.code==='unavailable'){resubscribeSoon();return}
    S.err=e.code; render();
  };
  const coll=(path,key,map)=>unsubs.push(db.collection(path).onSnapshot(snap=>{
    const m=new Map(); for(const d of snap.docs)m.set(d.id,d.data()); S[map]=overlay(path,m);
    if(!snap.metadata.fromCache){if(!outbox.length)S.offline=false;S.ready.add(key);if(S.ready.size>=3){clearTimeout(S.bootTimer);S.stale=false}}
    render();
  },fail));
  coll('decks','decks','decks'); coll('cards','cards','cards'); coll('reviews','revs','revs'); coll('flags','flags','flags'); coll('notes','notes','notes'); coll('qrev','qrev','qrev');
  unsubs.push(db.doc('config/settings').onSnapshot(d=>{
    const pend=pendingFor('config/settings');
    if(pend&&pend.b)S.settings={...S.settings,...pend.b}; else if(d.exists)S.settings={...S.settings,...d.data()};
    render();
  },fail));
  subLog(S.logKey||dayKey(Date.now()));
}
boot();
if(window.KAIROS_WEB&&window.KAIROS_WEB.account)window.KAIROS_WEB.account.onChange(()=>render());
</script>
