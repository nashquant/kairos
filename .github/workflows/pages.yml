name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tests/test_data.py $(git rev-parse -q --verify HEAD~1 >/dev/null && echo --base HEAD~1)
      - run: python3 scripts/build_web.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install cryptography
      - run: npm i --no-save jsdom@24 && node tests/web.test.js && node tests/offline.test.js && node tests/sync.test.js && node tests/flags.test.js && python3 tests/test_ingest.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
