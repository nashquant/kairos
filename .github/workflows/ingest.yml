name: Ingest private decks

on:
  push:
    branches: [main]
    paths: ["data/private/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://jiajbolbkmvfsmgxmbbx.supabase.co
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      KAIROS_OWNER_EMAIL: ${{ secrets.KAIROS_OWNER_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - name: Key pair (once)
        run: python3 scripts/ingest_private.py bootstrap
      - name: Commit public key if new
        run: |
          if [ -n "$(git status --porcelain data/ingest-public-key.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ingest-public-key.json
            git commit -m "Add ingest public key"
            git push
          fi
      - name: Apply new private chunks
        run: python3 scripts/ingest_private.py apply
