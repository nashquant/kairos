name: Keep Supabase awake

# Supabase pauses Free-plan projects after 7 days without database activity.
# One tiny read every 3 days keeps login and sync working when nobody studies.
on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row
        env:
          SUPABASE_URL: https://jiajbolbkmvfsmgxmbbx.supabase.co
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "Secret SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; fi
          curl -fsS "$SUPABASE_URL/rest/v1/ingest_state?select=*&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -o /dev/null
          echo "ok"
